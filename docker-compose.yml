version: '3.8'
services:
  init-certs:
    image: debian:bullseye-slim
    container_name: init-certs
    command: sh /certs.sh
    volumes:
      - ./certs.sh:/certs.sh
      - peer1-certs:/peer1-certs
      - peer2-certs:/peer2-certs
      - peer3-certs:/peer3-certs
    entrypoint: >
      sh -c "apt-get update && apt-get install -y openssl &&
            chmod +x ./certs.sh &&
            sh ./certs.sh"

  etcd1:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd1
    command:
      - etcd
      - --enable-v2
      - --name=etcd1
      - --data-dir=/var/etcd/data
      - --log-level=warn
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    volumes:
      - etcd1:/var/etcd/data
  etcd2:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd2
    command:
      - etcd
      - --enable-v2
      - --name=etcd2
      - --data-dir=/var/etcd/data
      - --log-level=warn
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    volumes:
      - etcd2:/var/etcd/data
  etcd3:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd3
    command:
      - etcd
      - --enable-v2
      - --name=etcd3
      - --data-dir=/var/etcd/data
      - --log-level=warn
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    volumes:
      - etcd3:/var/etcd/data
  peer1:
    build: .
    container_name: peer1
    command:
      - --id=1
      - --etcd=http://etcd1:2379
      - --cluster=http://peer1:2380,http://peer2:2380,http://peer3:2380
      - --threshold=2
    volumes:
      - peer1:/var/app/data
      - peer1-certs:/etc/certs
    depends_on:
      - etcd1
  peer2:
    build: .
    container_name: peer2
    command:
      - --id=2
      - --etcd=http://etcd2:2379
      - --cluster=http://peer1:2380,http://peer2:2380,http://peer3:2380
      - --threshold=2
    volumes:
      - peer2:/var/app/data
      - peer2-certs:/etc/certs
    depends_on:
      - etcd2
  peer3:
    build: .
    container_name: peer3
    command:
      - --id=3
      - --etcd=http://etcd3:2379
      - --cluster=http://peer1:2380,http://peer2:2380,http://peer3:2380
      - --threshold=2
    volumes:
      - peer3:/var/app/data
      - peer3-certs:/etc/certs
    depends_on:
      - etcd3
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - peer1
      - peer2
      - peer3
volumes:
  etcd1:
  etcd2:
  etcd3:
  peer1:
  peer2:
  peer3:
  peer1-certs:
  peer2-certs:
  peer3-certs:
  